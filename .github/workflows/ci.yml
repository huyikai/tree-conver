name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 推荐在 GitHub 仓库设置中启用 Branch protection，
# 勾选 "Require status checks to pass before merging" 并选择本工作流的 job。

jobs:
  test:
    name: Test & Type-check (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # 在 monorepo 根跑一次 npm ci 即可，workspaces 会一起安装
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        working-directory: packages/tree-conver
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: packages/tree-conver
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (package source)
        working-directory: packages/tree-conver
        run: npx eslint src --ext .ts

      - name: Run ESLint (docs / root)
        run: npm run lint

  build:
    name: Build package
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: packages/tree-conver
        run: npm run build
